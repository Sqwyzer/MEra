async function extractLy(f){try{if(!f||!f.slice)return'';const h=new Uint8Array(await f.slice(0,12).arrayBuffer());let t='';if(h[0]==73&&h[1]==68&&h[2]==51)t=await lyID3(f);else if(h[0]==102&&h[1]==76&&h[2]==97&&h[3]==67)t=await lyFlac(f);else if(h[4]==102&&h[5]==116&&h[6]==121&&h[7]==112)t=await lyMp4(f);t=(t||'').replace(/\u0000/g,'').trim();return t.length>60000?t.slice(0,60000):t}catch(e){return''}}
const readTxt=async f=>{const b=new Uint8Array(await f.arrayBuffer());try{return new TextDecoder('utf-8',{fatal:true}).decode(b).replace(/^\uFEFF/,'')}catch(e){return new TextDecoder('windows-1251').decode(b)}};
{const PL0=parseLy;parseLy=t=>PL0(String(t).replace(/<\d+:\d+(?:[.:]\d+)?>/g,''))}
S.lyn=S.lyn||{};
/* при добавлении: теги + файлы .lrc/.srt/.vtt/.txt с тем же именем */
{const AD2=add,nm=n=>String(n||'').replace(/\.[^.]+$/,'').replace(/\.[a-z]{2,3}$/i,'').toLowerCase().replace(/\s+/g,' ').trim();
add=async function(fs){fs=[...fs];const isL=f=>/\.(lrc|srt|vtt|txt)$/i.test(f.name),ly=fs.filter(isL),au=fs.filter(f=>!isL(f)),before=new Set(songs.map(s=>s.id));
if(au.length)await AD2(au);else if(!ly.length)return AD2(fs);
let n=0;for(const s of songs){if(before.has(s.id)||S.ly[s.id])continue;const t=await extractLy(s.f);if(t){S.ly[s.id]=t;n++}}
for(const f of ly){const b=nm(f.name),m=songs.find(s=>s.f&&nm(s.f.name)==b)||songs.find(s=>nm(s.title)==b);if(m){try{S.ly[m.id]=await readTxt(f);delete S.lyn[m.id];n++}catch(e){}}else toast(L2('Не нашёл песню для «'+f.name+'»','No matching song for “'+f.name+'”'))}
if(n){save();if(cur&&S.ly[cur.id])drawNP();toast(L2('Субтитры добавлены: '+n,'Lyrics added: '+n))}}}
$('#lf').onchange=async e=>{const f=e.target.files[0];if(f&&cur){S.ly[cur.id]=await readTxt(f);delete S.lyn[cur.id];save();hsh();drawNP()}e.target.value=''};
/* автопоиск в тегах при первом воспроизведении */
{const P5=play;play=function(){const r=P5.apply(this,arguments);const s=cur;if(s&&!S.ly[s.id]&&!S.lyn[s.id])extractLy(s.f).then(t=>{if(t){S.ly[s.id]=t;if(cur&&cur.id==s.id)drawNP()}else S.lyn[s.id]=1;save()});return r}}
{const LY0=ACT.lyr;ACT.lyr=()=>{LY0();const a=document.querySelector('#sh .dlg .acts');if(a)a.insertAdjacentHTML('beforeend',`<button class="btn t" data-a=lfind>${I('search')}${L2('Из тегов файла','From file tags')}</button>`)}}
ACT.lfind=async()=>{const s=cur;if(!s)return;toast(L2('Ищу в файле…','Searching…'));const t=await extractLy(s.f);if(t){S.ly[s.id]=t;delete S.lyn[s.id];save();hsh();drawNP();toast(L2('Субтитры найдены в файле','Lyrics found in the file'))}else toast(L2('В тегах файла субтитров нет','No lyrics in the file tags'))};
/* полноэкранный режим */
document.body.insertAdjacentHTML('beforeend',`<div id=lyo><div class=lyb></div><div class=lys></div><div class=lyh><button class=ib data-a=lyx aria-label="Закрыть">${I('keyboard_arrow_down')}</button><div class=tx><div class="tt ell" id=lyt></div><div class="sb ell" id=lya></div></div><button class=ib data-a=lyr aria-label="Изменить">${I('edit')}</button></div><div class=lyc id=lyc></div><div class=lyf2><div class=lypr><i id=lypb></i></div><div class=lyct><button class=ib data-a=prev>${I('skip_previous')}</button><button class=ib id=lypp data-a=pp>${I('play_arrow')}</button><button class=ib data-a=next>${I('skip_next')}</button></div></div></div>`);
let lyUser=0,lyLast=-2;
function lyoBuild(){const c=$('#lyc');if(!c||!cur)return;const t=A.currentTime;li=-1;for(let j=0;j<cues.length;j++){if(cues[j].t<=t)li=j;else break}
$('#lyo .lyb').style.setProperty('--lyc',cur.cv?'url("'+cur.cv+'")':'linear-gradient(160deg,var(--p),var(--t))');$('#lyt').textContent=cur.title;$('#lya').textContent=cur.artist||'';
const raw=S.ly[cur.id]||'',pl=!parseLy(raw).length;c.classList.toggle('pl',pl);
c.innerHTML=pl?raw.split(/\r?\n/).map(l=>l.trim()?`<div class=lo>${E(l.trim())}</div>`:'<div class=lsp></div>').join(''):cues.map((q,i)=>`<div class=lo data-a=lo data-t=${q.t} data-i=${i}>${E(q.x)||'♪'}</div>`).join('');
lyLast=-2;const pp=$('#lypp');if(pp)pp.innerHTML=I(A.paused?'play_arrow':'pause')}
function lyoSync(force){const o=$('#lyo');if(!o||!o.classList.contains('o'))return;const bar=$('#lypb');if(bar)bar.style.width=(A.currentTime/D()*100)+'%';const c=$('#lyc');if(c.classList.contains('pl'))return;if(!force&&li===lyLast)return;lyLast=li;const ls=c.children;for(let i=0;i<ls.length;i++){const d=Math.abs(i-li);ls[i].className='lo'+(i==li?' on':d==1?' d1':d==2?' d2':'')}
const el=ls[li];if(el&&(force||Date.now()-lyUser>3500))c.scrollTo({top:el.offsetTop-c.clientHeight*.32+el.offsetHeight/2,behavior:force?'auto':'smooth'});else if(!el&&force)c.scrollTo({top:0})}
const lyoOpen=()=>{if(!cues.length&&!(cur&&S.ly[cur.id]))return;lyoBuild();$('#lyo').classList.add('o');lyoSync(true)};
Object.assign(ACT,{lfull:lyoOpen,lyx:()=>$('#lyo').classList.remove('o'),lo:e=>{A.currentTime=+e.dataset.t;lyUser=0;if(A.paused)A.play().catch(()=>{})}});
{const c=$('#lyc'),u=()=>{lyUser=Date.now()};c.addEventListener('wheel',u,{passive:true});c.addEventListener('touchmove',u,{passive:true})}
{const LL0=loadLy;loadLy=function(){LL0.apply(this,arguments);const o=$('#lyo');if(o&&o.classList.contains('o')){if(cues.length||(cur&&S.ly[cur.id])){lyoBuild();lyoSync(true)}else o.classList.remove('o')}}}
{const U4=upd;upd=function(){U4();lyoSync()}}
A.addEventListener('seeked',()=>{const o=$('#lyo');if(o&&o.classList.contains('o'))upd()});
const lyPP=()=>{const b=$('#lypp');if(b)b.innerHTML=I(A.paused?'play_arrow':'pause')};A.addEventListener('play',lyPP);A.addEventListener('pause',lyPP);
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#lyo').classList.contains('o'))ACT.lyx()});

function revealIn(m){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const sel='.row,.card,.hero,.pc,.stt,.lseg,.search,.shelf,.rh,.stn,.pfa2,.pfn,.favc,#main>h1',vh=innerHeight;let n=0;[...m.querySelectorAll(sel)].filter(e=>!e.parentElement.closest(sel)).forEach(e=>{const r=e.getBoundingClientRect();if(r.bottom<0||r.top>vh||n>30)return;e.classList.add('rv');e.style.setProperty('--dl',Math.min(n,11)*60+'ms');n++})}
if(S.set.bgfx=='breathe'){S.set.bgfx='off';save()}
